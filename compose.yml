services:
  magnum:
    build: .
    image: magnum-dashboard
    container_name: magnum
    restart: unless-stopped
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    group_add:
      - dialout
    environment:
      MAGNUM_DEVICES: /dev/ttyUSB0
      # MAGNUM_INTERVAL: "2"          # serial poll seconds
      # MAGNUM_HISTORY_HOURS: "24"
    ports:
      - "17223:17223"
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "3" }
